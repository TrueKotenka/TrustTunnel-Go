name: Build Android

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  LLVM_MAJOR_VER: 21
  LLVM_INSTALLER_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
  BUILD_DIR: build
  ANDROID_NDK_VERSION: 28.1.13356709
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-26

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-android-dynamic" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"
          test "$(conan --version)" = "Conan version $CONAN_VERSION"

          # Install LLVM/Clang (needed for host tools during cross-compilation)
          llvm_installer="$RUNNER_TEMP/llvm-apt-installer.sh"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://apt.llvm.org/llvm.sh --output "$llvm_installer"
          printf '%s  %s\n' "$LLVM_INSTALLER_SHA256" "$llvm_installer" | sha256sum --check --strict
          sudo bash "$llvm_installer" "$LLVM_MAJOR_VER"
          rm "$llvm_installer"
          sudo apt-get install -y libc++-${LLVM_MAJOR_VER}-dev libclang-rt-${LLVM_MAJOR_VER}-dev
          echo "/usr/lib/llvm-$LLVM_MAJOR_VER/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: android-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-android-dynamic
          key: android-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-conan

      - name: Prepare pinned unlocked Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode unlocked

      - name: Prepare dobby_bridge build
        run: |
          echo 'add_subdirectory("../dobby_bridge" "dobby_bridge")' >> TrustTunnelClient/CMakeLists.txt

      - name: CMake configure (Android cross-compile)
        working-directory: TrustTunnelClient
        run: |
          mkdir -p $BUILD_DIR && cd $BUILD_DIR && \
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DANDROID_STL=c++_static \
            -DIPV6_UNAVAILABLE=ON \
            -GNinja \
            ..

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-android-dynamic
          key: android-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build $BUILD_DIR --target dobby_bridge

      - name: Prepare library directory
        run: |
          mkdir -p lib/android/${{ env.ANDROID_ABI }}
          cp TrustTunnelClient/$BUILD_DIR/dobby_bridge/libdobby_bridge.so lib/android/${{ env.ANDROID_ABI }}/
          echo "=== Library info ==="
          file lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.so
          ls -lh lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.so
          echo "=== Exported symbols ==="
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D \
            lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.so | grep -i "dobby" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-android-${{ env.ANDROID_ABI }}
          path: lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.so

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build Go example (verify linking)
        working-directory: examples
        run: |
          # Build the Go example for Android arm64 using the NDK toolchain.
          # We don't run it (requires emulator or device), but we verify it links perfectly.
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          
          go build -v -o examples_android

  android-arm64-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-android-static" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"
          test "$(conan --version)" = "Conan version $CONAN_VERSION"

          # Install LLVM/Clang (needed for host tools during cross-compilation)
          llvm_installer="$RUNNER_TEMP/llvm-apt-installer.sh"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://apt.llvm.org/llvm.sh --output "$llvm_installer"
          printf '%s  %s\n' "$LLVM_INSTALLER_SHA256" "$llvm_installer" | sha256sum --check --strict
          sudo bash "$llvm_installer" "$LLVM_MAJOR_VER"
          rm "$llvm_installer"
          sudo apt-get install -y libc++-${LLVM_MAJOR_VER}-dev libclang-rt-${LLVM_MAJOR_VER}-dev
          echo "/usr/lib/llvm-$LLVM_MAJOR_VER/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: android-static-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-android-static
          key: android-static-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-conan

      - name: Prepare pinned unlocked Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode unlocked

      - name: Prepare dobby_bridge build
        run: |
          echo 'add_subdirectory("../dobby_bridge" "dobby_bridge")' >> TrustTunnelClient/CMakeLists.txt

      - name: CMake configure (Android cross-compile)
        working-directory: TrustTunnelClient
        run: |
          mkdir -p $BUILD_DIR && cd $BUILD_DIR && \
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DANDROID_STL=c++_static \
            -DIPV6_UNAVAILABLE=ON \
            -DDOBBY_BRIDGE_STATIC=ON \
            -GNinja \
            ..

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-android-static
          key: android-static-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-android.yml') }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build $BUILD_DIR --target dobby_bridge

      - name: Prepare library directory
        run: |
          mkdir -p lib/android/${{ env.ANDROID_ABI }}
          
          STATIC_LIBS=$(find TrustTunnelClient/$BUILD_DIR -name "*.a" \
            -not -path "*/CMakeFiles/*" \
            -not -name "*.dll.a" \
            | sort)
            
          CONAN_LIBS=$(find "$CONAN_HOME/p" -type f -name "*.a" | grep "/p/lib/" | sort)
          
          echo "create lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.a" > merge.mri
          for lib in $STATIC_LIBS $CONAN_LIBS; do
            echo "addlib $lib" >> merge.mri
          done
          echo "save" >> merge.mri
          echo "end" >> merge.mri
          
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar -M < merge.mri
          
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.a
          
          echo "=== Merged library info ==="
          file lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-android-${{ env.ANDROID_ABI }}-static
          path: lib/android/${{ env.ANDROID_ABI }}/libdobby_bridge.a

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build Go example (verify linking)
        working-directory: examples
        run: |
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          
          go build -tags static -v -o examples_android
