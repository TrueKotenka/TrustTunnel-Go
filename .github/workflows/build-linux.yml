name: Build Linux

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  LLVM_MAJOR_VER: 21
  LLVM_INSTALLER_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
  BUILD_DIR: build

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-linux" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"
          test "$(conan --version)" = "Conan version $CONAN_VERSION"

          # Install LLVM/Clang
          llvm_installer="$RUNNER_TEMP/llvm-apt-installer.sh"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://apt.llvm.org/llvm.sh --output "$llvm_installer"
          printf '%s  %s\n' "$LLVM_INSTALLER_SHA256" "$llvm_installer" | sha256sum --check --strict
          sudo bash "$llvm_installer" "$LLVM_MAJOR_VER"
          rm "$llvm_installer"
          sudo apt-get install -y libc++-${LLVM_MAJOR_VER}-dev libclang-rt-${LLVM_MAJOR_VER}-dev
          echo "/usr/lib/llvm-$LLVM_MAJOR_VER/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: linux-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-linux.yml') }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-linux.yml') }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-linux
          key: linux-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-linux.yml') }}-conan

      - name: Prepare pinned unlocked Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode unlocked

      - name: Prepare dobby_bridge build
        run: |
          echo 'add_subdirectory("../dobby_bridge" "dobby_bridge")' >> TrustTunnelClient/CMakeLists.txt

      - name: CMake configure
        working-directory: TrustTunnelClient
        run: |
          mkdir -p $BUILD_DIR && cd $BUILD_DIR && \
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="clang" \
            -DCMAKE_CXX_COMPILER="clang++" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIPV6_UNAVAILABLE=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -GNinja \
            ..

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-linux
          key: linux-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-linux.yml') }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build $BUILD_DIR --target dobby_bridge

      - name: Prepare library directory
        run: |
          mkdir -p lib/linux
          cp TrustTunnelClient/$BUILD_DIR/dobby_bridge/libdobby_bridge.so lib/linux/
          echo "=== Library info ==="
          file lib/linux/libdobby_bridge.so
          ls -lh lib/linux/libdobby_bridge.so
          echo "=== Exported symbols ==="
          nm -D lib/linux/libdobby_bridge.so | grep -i "dobby" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-linux-x86_64
          path: lib/linux/libdobby_bridge.so

      - name: Build Go example
        working-directory: examples
        run: go build -v -o examples
