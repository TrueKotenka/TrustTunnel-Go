name: Build iOS

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  BUILD_DIR: build
  IOS_DEPLOYMENT_TARGET: "15.6"
  IPHONEOS_DEPLOYMENT_TARGET: "15.6"
  APPLE_TOOLCHAIN_KEY: xcode-26.3-17C529

jobs:
  ios-arm64:
    runs-on: macos-15
    env:
      DOBBY_CONAN_LOCKFILE: ${{ github.workspace }}/scripts/pins/conan/apple-ios-arm64.lock
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-ios" >> "$GITHUB_ENV"

      - name: Select exact Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Derive Apple native input digest
        id: native-input
        run: |
          digest="$(python3 scripts/apple_native_input_digest.py \
            --platform ios \
            --conan-version "$CONAN_VERSION" \
            --xcode-key "$APPLE_TOOLCHAIN_KEY" \
            --deployment-target "$IOS_DEPLOYMENT_TARGET" \
            --rust-toolchain 1.85.0)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: |
          brew install ninja
          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"
          pip install "conan==$CONAN_VERSION"

          PY_BIN=$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_BIN" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-ios

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ios-${{ env.IOS_DEPLOYMENT_TARGET }}-${{ env.APPLE_TOOLCHAIN_KEY }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ios-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-ios
          key: ios-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Verify Apple static tooling on pristine checkout
        run: |
          python3 -m unittest \
            scripts/tests/test_apple_native_input_digest.py \
            scripts/tests/test_build_apple_static.py \
            scripts/tests/test_package_release_assets.py \
            scripts/tests/test_prepare_pinned_conan.py \
            scripts/tests/test_prune_apple_compiler_builtins.py \
            scripts/tests/test_repository_text_contract.py \
            scripts/tests/test_verify_apple_archive.py \
            scripts/tests/test_workflow_contracts.py

      - name: Prepare pinned Conan recipes and provider
        run: python3 scripts/prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode locked

      - name: Build and verify iOS bridge
        run: scripts/build_apple_static.sh ios

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-ios
          key: ios-${{ runner.arch }}-${{ steps.native-input.outputs.digest }}-conan

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libdobby_bridge-ios-arm64
          path: lib/ios/libdobby_bridge.a
