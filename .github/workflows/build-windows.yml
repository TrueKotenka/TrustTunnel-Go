name: Build Windows

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  BUILD_DIR: build

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        shell: bash
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-windows" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # MSVC is REQUIRED — TrustTunnel's conan profiles expect MSVC on Windows.
      # CGO uses MinGW GCC, but that's fine: the C API boundary is ABI-compatible.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify hosted MSVC compatibility contract
        run: |
          $compiler = Get-Command cl.exe -CommandType Application -ErrorAction Stop
          $compilerVersion = $compiler.FileVersionInfo.ProductVersion
          $linker = Get-Command link.exe -CommandType Application -ErrorAction Stop
          $linkerVersion = $linker.FileVersionInfo.ProductVersion
          Write-Host "MSVC compiler: $($compiler.Source) ($compilerVersion)"
          Write-Host "MSVC linker: $($linker.Source) ($linkerVersion)"
          if ($compilerVersion -notmatch '^19\.51\.') { throw "Expected MSVC 19.51, found $compilerVersion" }
          if ($linkerVersion -notmatch '^14\.51\.') { throw "Expected MSVC linker 14.51, found $linkerVersion" }
          if ($env:VCToolsVersion -notmatch '^14\.51\.') { throw "Expected MSVC tools 14.51, found $env:VCToolsVersion" }
          if ($compiler.Source -notmatch '\\Hostx64\\x64\\cl\.exe$') { throw "Expected the hosted x64 compiler, found $($compiler.Source)" }
          if ($linker.Source -notmatch '\\Hostx64\\x64\\link\.exe$') { throw "Expected the hosted x64 linker, found $($linker.Source)" }

      - name: Install packages
        run: |
          choco install strawberryperl nasm ninja -y
          pip install "conan==$env:CONAN_VERSION"
          if ((conan --version) -ne "Conan version $env:CONAN_VERSION") { throw "Conan version differs from the pinned workflow input" }
          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/conan/windows-msvc-195-compat.profile', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/conan/windows-msvc-195-compat.profile', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-windows
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/conan/windows-msvc-195-compat.profile', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-conan

      - name: Prepare pinned unlocked Conan recipes and provider
        run: python scripts\prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode unlocked

      - name: Prepare dobby_bridge build
        run: |
          Add-Content -Path TrustTunnelClient\CMakeLists.txt -Value 'add_subdirectory("../dobby_bridge" "dobby_bridge")'

      - name: CMake configure
        working-directory: TrustTunnelClient
        run: |
          mkdir ${{ env.BUILD_DIR }}
          cd ${{ env.BUILD_DIR }}
          cmake -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="cl.exe" `
            -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCONAN_HOST_PROFILE="${{ github.workspace }}/TrustTunnelClient/conan/profiles/windows-msvc.jinja;auto-cmake;${{ github.workspace }}/scripts/pins/conan/windows-msvc-195-compat.profile" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DIPV6_UNAVAILABLE=ON `
            -G "Ninja" `
            ..

      - name: Verify composed Conan host profile
        working-directory: TrustTunnelClient
        run: |
          $autoProfilePath = Join-Path $env:BUILD_DIR "conan_host_profile"
          $autoProfile = Get-Content -LiteralPath $autoProfilePath -Raw
          foreach ($required in @(
            '(?m)^compiler=msvc\r?$',
            '(?m)^compiler\.version=195\r?$',
            '(?m)^compiler\.runtime=static\r?$',
            '(?m)^compiler\.runtime_type=Release\r?$'
          )) {
            if ($autoProfile -notmatch $required) { throw "Generated Conan profile lacks $required" }
          }
          $profileJson = conan profile show `
            --profile:host="${{ github.workspace }}/TrustTunnelClient/conan/profiles/windows-msvc.jinja" `
            --profile:host="$autoProfilePath" `
            --profile:host="${{ github.workspace }}/scripts/pins/conan/windows-msvc-195-compat.profile" `
            --profile:build=default `
            --format=json
          if ($LASTEXITCODE -ne 0) { throw "Unable to compose the effective Conan profiles" }
          $settings = ($profileJson | ConvertFrom-Json).host.settings
          if ($settings.compiler -ne 'msvc') { throw "Effective Conan compiler is not msvc" }
          if ($settings.'compiler.version' -ne '194') { throw "Effective Conan compatibility identity is not 194" }
          if ($settings.'compiler.runtime' -ne 'static') { throw "Effective Conan runtime is not static" }
          if ($settings.'compiler.runtime_type' -ne 'Release') { throw "Effective Conan runtime type is not Release" }

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-windows
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/conan/windows-msvc-195-compat.profile', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build ${{ env.BUILD_DIR }} --target dobby_bridge

      - name: Prepare library directory
        run: |
          New-Item -ItemType Directory -Force -Path lib\windows
          Copy-Item TrustTunnelClient\${{ env.BUILD_DIR }}\dobby_bridge\dobby_bridge.dll lib\windows\
          Copy-Item TrustTunnelClient\${{ env.BUILD_DIR }}\dobby_bridge\dobby_bridge.lib lib\windows\
          Write-Host "=== Library files ==="
          Get-ChildItem lib\windows\ | Format-Table Name, Length
          Write-Host "=== DLL exports ==="
          dumpbin /exports lib\windows\dobby_bridge.dll | Select-String "dobby"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby_bridge-windows-x86_64
          path: |
            lib/windows/dobby_bridge.dll
            lib/windows/dobby_bridge.lib

      - name: Build Go example
        working-directory: examples
        run: go build -v -o examples.exe
