name: Build Windows

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.12.2
  BUILD_DIR: build

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure isolated Conan home
        shell: bash
        run: echo "CONAN_HOME=$RUNNER_TEMP/dobby-conan-windows" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # MSVC is REQUIRED — TrustTunnel's conan profiles expect MSVC on Windows.
      # CGO uses MinGW GCC, but that's fine: the C API boundary is ABI-compatible.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify hosted MSVC compatibility contract
        run: |
          $compilerPath = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe'
          $linkerPath = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          $compiler = Get-Item -LiteralPath $compilerPath -ErrorAction Stop
          $linker = Get-Item -LiteralPath $linkerPath -ErrorAction Stop
          $compilerFileVersion = $compiler.VersionInfo.ProductVersion
          $linkerFileVersion = $linker.VersionInfo.ProductVersion
          Write-Host "MSVC compiler: $compilerPath ($compilerFileVersion)"
          Write-Host "MSVC linker: $linkerPath ($linkerFileVersion)"
          if ($compilerFileVersion -notmatch '^14\.51\.') { throw "Expected MSVC compiler file 14.51, found $compilerFileVersion" }
          if ($linkerFileVersion -notmatch '^14\.51\.') { throw "Expected MSVC linker file 14.51, found $linkerFileVersion" }
          if ($env:VCToolsVersion -notmatch '^14\.51\.') { throw "Expected MSVC tools 14.51, found $env:VCToolsVersion" }
          $probePath = Join-Path $env:RUNNER_TEMP 'dobby-msvc-version.c'
          Set-Content -LiteralPath $probePath -Value 'DOBBY_MSVC_VERSION _MSC_VER' -Encoding ascii
          $probeOutput = (& $compilerPath /nologo /EP $probePath 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "MSVC version probe failed: $probeOutput" }
          Write-Host $probeOutput
          if ($probeOutput -notmatch '(?m)^DOBBY_MSVC_VERSION 1951\r?$') { throw "Expected _MSC_VER 1951, found: $probeOutput" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOBBY_MSVC_COMPILER=$compilerPath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOBBY_MSVC_LINKER=$linkerPath"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $compilerPath)

      - name: Install packages
        run: |
          choco install strawberryperl nasm ninja -y
          pip install "conan==$env:CONAN_VERSION"
          if ((conan --version) -ne "Conan version $env:CONAN_VERSION") { throw "Conan version differs from the pinned workflow input" }
          pip install "pyyaml==6.0.3" "clangd-tidy==1.1.1" "tqdm==4.67.1"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-ccache

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-cargo

      - name: Conan cache
        uses: actions/cache@v5
        id: conan-cache
        with:
          path: ${{ runner.temp }}/dobby-conan-windows
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-conan

      - name: Prepare pinned unlocked Conan recipes and provider
        run: python scripts\prepare_pinned_conan.py --trusttunnel TrustTunnelClient --mode unlocked --msvc-195-compat

      - name: Prepare dobby_bridge build
        run: |
          Add-Content -Path TrustTunnelClient\CMakeLists.txt -Value 'add_subdirectory("../dobby_bridge" "dobby_bridge")'

      - name: CMake configure
        working-directory: TrustTunnelClient
        run: |
          mkdir ${{ env.BUILD_DIR }}
          cd ${{ env.BUILD_DIR }}
          cmake -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:DOBBY_MSVC_COMPILER" `
            -DCMAKE_CXX_COMPILER="$env:DOBBY_MSVC_COMPILER" `
            -DCMAKE_LINKER="$env:DOBBY_MSVC_LINKER" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DIPV6_UNAVAILABLE=ON `
            -G "Ninja" `
            ..

      - name: Verify composed Conan host profile
        working-directory: TrustTunnelClient
        run: |
          function Get-CMakeCachePath([string] $name) {
            $entries = @(Get-Content -LiteralPath (Join-Path $env:BUILD_DIR 'CMakeCache.txt') | Where-Object { $_ -match "^$($name):[^=]*=" })
            if ($entries.Count -ne 1) { throw "Expected one $name CMake cache entry, found $($entries.Count)" }
            return ($entries[0] -split '=', 2)[1]
          }
          function Assert-SamePath([string] $description, [string] $actual, [string] $expected) {
            if ([String]::IsNullOrWhiteSpace($actual) -or [String]::IsNullOrWhiteSpace($expected)) {
              throw "$description path is empty: actual=$actual expected=$expected"
            }
            $actualFull = [IO.Path]::GetFullPath($actual)
            $expectedFull = [IO.Path]::GetFullPath($expected)
            if (-not [String]::Equals($actualFull, $expectedFull, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$description differs: actual=$actualFull expected=$expectedFull"
            }
          }
          Assert-SamePath 'C compiler' (Get-CMakeCachePath 'CMAKE_C_COMPILER') $env:DOBBY_MSVC_COMPILER
          Assert-SamePath 'CXX compiler' (Get-CMakeCachePath 'CMAKE_CXX_COMPILER') $env:DOBBY_MSVC_COMPILER
          Assert-SamePath 'linker' (Get-CMakeCachePath 'CMAKE_LINKER') $env:DOBBY_MSVC_LINKER
          $autoProfilePath = Join-Path $env:BUILD_DIR "conan_host_profile"
          $autoProfile = Get-Content -LiteralPath $autoProfilePath -Raw
          foreach ($required in @(
            '(?m)^compiler=msvc\r?$',
            '(?m)^compiler\.version=194\r?$',
            '(?m)^compiler\.runtime=static\r?$',
            '(?m)^compiler\.runtime_type=Release\r?$'
          )) {
            if ($autoProfile -notmatch $required) { throw "Generated Conan profile lacks $required" }
          }
          $profileJson = conan profile show `
            --profile:host="${{ github.workspace }}/TrustTunnelClient/conan/profiles/windows-msvc.jinja" `
            --profile:host="$autoProfilePath" `
            --profile:build=default `
            --format=json
          if ($LASTEXITCODE -ne 0) { throw "Unable to compose the effective Conan profiles" }
          $effectiveProfile = $profileJson | ConvertFrom-Json
          $settings = $effectiveProfile.host.settings
          if ($settings.compiler -ne 'msvc') { throw "Effective Conan compiler is not msvc" }
          if ($settings.'compiler.version' -ne '194') { throw "Effective Conan compatibility identity is not 194" }
          if ($settings.'compiler.runtime' -ne 'static') { throw "Effective Conan runtime is not static" }
          if ($settings.'compiler.runtime_type' -ne 'Release') { throw "Effective Conan runtime type is not Release" }
          if ($effectiveProfile.host.conf.'tools.microsoft.msbuild:installation_path' -ne '') {
            throw "Effective Conan profile must disable redundant Visual Studio activation"
          }
          $conanCompilers = $effectiveProfile.host.conf.'tools.build:compiler_executables'
          Assert-SamePath 'Conan C compiler' $conanCompilers.c $env:DOBBY_MSVC_COMPILER
          Assert-SamePath 'Conan CXX compiler' $conanCompilers.cpp $env:DOBBY_MSVC_COMPILER

      - name: Save conan cache
        uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dobby-conan-windows
          key: windows-${{ runner.arch }}-${{ hashFiles('scripts/prepare_pinned_conan.py', 'scripts/pins/quiche-0.17.1.Cargo.lock', 'scripts/pins/quiche-0.17.1-ring-0.17.Cargo.lock', 'TrustTunnelClient/**', 'dobby_bridge/**', '.github/workflows/build-windows.yml') }}-conan

      - name: Build dobby_bridge
        working-directory: TrustTunnelClient
        run: cmake --build ${{ env.BUILD_DIR }} --target dobby_bridge

      - name: Prepare library directory
        run: |
          New-Item -ItemType Directory -Force -Path lib\windows
          Copy-Item TrustTunnelClient\${{ env.BUILD_DIR }}\dobby_bridge\dobby_bridge.dll lib\windows\
          Copy-Item TrustTunnelClient\${{ env.BUILD_DIR }}\dobby_bridge\dobby_bridge.lib lib\windows\
          Write-Host "=== Library files ==="
          Get-ChildItem lib\windows\ | Format-Table Name, Length
          Write-Host "=== DLL exports ==="
          dumpbin /exports lib\windows\dobby_bridge.dll | Select-String "dobby"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby_bridge-windows-x86_64
          path: |
            lib/windows/dobby_bridge.dll
            lib/windows/dobby_bridge.lib

      - name: Build Go example
        working-directory: examples
        run: go build -v -o examples.exe
