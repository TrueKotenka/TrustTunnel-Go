name: Update Static Libraries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Target branch whose exact head owns the source inputs
        required: true
        default: main
      source_sha:
        description: Full source commit shared by every selected build run
        required: true
      android_run_id:
        description: Successful Build Android run ID at source_sha
        required: true
      ios_run_id:
        description: Successful Build iOS run ID at source_sha
        required: true
      macos_run_id:
        description: Successful Build macOS run ID at source_sha
        required: true

jobs:
  update-libs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_BRANCH: ${{ inputs.branch }}
      ANDROID_RUN_ID: ${{ inputs.android_run_id }}
      IOS_RUN_ID: ${{ inputs.ios_run_id }}
      MACOS_RUN_ID: ${{ inputs.macos_run_id }}
    steps:
      - name: Checkout exact target head
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Verify source and selected runs
        run: |
          set -euo pipefail
          git check-ref-format --branch "$TARGET_BRANCH"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          verify_run() {
            local run_id="$1"
            local workflow_name="$2"
            test "$(gh run view "$run_id" --json headSha --jq .headSha)" = "$SOURCE_SHA"
            test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = success
            test "$(gh run view "$run_id" --json workflowName --jq .workflowName)" = "$workflow_name"
          }

          verify_run "$ANDROID_RUN_ID" "Build Android"
          verify_run "$IOS_RUN_ID" "Build iOS"
          verify_run "$MACOS_RUN_ID" "Build macOS"

      - name: Download exact static artifacts
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/static-libraries"
          mkdir -p "$stage/android" "$stage/ios" "$stage/macos"
          gh run download "$ANDROID_RUN_ID" \
            --name libdobby_bridge-android-arm64-v8a-static \
            --dir "$stage/android"
          gh run download "$IOS_RUN_ID" \
            --name libdobby_bridge-ios-arm64 \
            --dir "$stage/ios"
          gh run download "$MACOS_RUN_ID" \
            --name libdobby_bridge-macos-arm64-static \
            --dir "$stage/macos"

          verify_single_archive() {
            local directory="$1"
            local expected="$directory/libdobby_bridge.a"
            local entries
            entries="$(find "$directory" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
            test "$entries" = "libdobby_bridge.a"
            test -f "$expected"
            test ! -L "$expected"
          }
          verify_single_archive "$stage/android"
          verify_single_archive "$stage/ios"
          verify_single_archive "$stage/macos"
          install -D -m 0644 "$stage/android/libdobby_bridge.a" lib/android/arm64-v8a/libdobby_bridge.a
          install -D -m 0644 "$stage/ios/libdobby_bridge.a" lib/ios/libdobby_bridge.a
          install -D -m 0644 "$stage/macos/libdobby_bridge.a" lib/macos/libdobby_bridge.a

          android_sha="$(sha256sum lib/android/arm64-v8a/libdobby_bridge.a | awk '{print $1}')"
          ios_sha="$(sha256sum lib/ios/libdobby_bridge.a | awk '{print $1}')"
          macos_sha="$(sha256sum lib/macos/libdobby_bridge.a | awk '{print $1}')"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg android_run_id "$ANDROID_RUN_ID" \
            --arg android_sha256 "$android_sha" \
            --arg ios_run_id "$IOS_RUN_ID" \
            --arg ios_sha256 "$ios_sha" \
            --arg macos_run_id "$MACOS_RUN_ID" \
            --arg macos_sha256 "$macos_sha" \
            '{schema: 1, source_sha: $source_sha, artifacts: {
              android: {run_id: $android_run_id, sha256: $android_sha256},
              ios: {run_id: $ios_run_id, sha256: $ios_sha256},
              macos: {run_id: $macos_run_id, sha256: $macos_sha256}
            }}' > lib/static-libraries.provenance.json

      - name: Commit and push exact artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/android/arm64-v8a/libdobby_bridge.a \
            lib/ios/libdobby_bridge.a \
            lib/macos/libdobby_bridge.a \
            lib/static-libraries.provenance.json

          if git diff --staged --quiet; then
            echo "No static-library changes detected"
            exit 0
          fi

          git commit -m "chore: update exact-source static libraries"
          git fetch origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
